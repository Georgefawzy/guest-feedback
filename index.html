<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guest Feedback</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef6f7;--surface:#fff;--ink:#3a2c1b;--muted:#6b5d4d;--line:#cfe0e3;--accent:#544028;--accent-ink:#fff;--star:#60acb8;--off:#dbe8ea;--err:#b3261e;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#1f1812;--surface:#2b2218;--ink:#f3ece3;--muted:#bfb1a0;--line:#4a3d2e;--accent:#60acb8;--accent-ink:#1f1812;--star:#7cc3ce;--off:#43372a;--err:#ff8a80}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Cairo,system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 0 16px}
.logo{height:76px;width:auto;background:#fff;border-radius:12px;padding:6px 12px;display:block}
body{border-top:6px solid #60acb8}
.lang{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:4px 14px;font:inherit;cursor:pointer}
h1{font-size:32px;line-height:1.25;font-weight:800;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 24px}
form,.done{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.field{margin-bottom:20px}
label,.lbl{display:block;font-weight:600;margin-bottom:6px}
.opt{color:var(--muted);font-weight:400}
select,input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:110px;resize:vertical}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.overall{padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.overall .stars button{font-size:46px;width:20%}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.row .lbl{margin:0;font-weight:400}
.stars{display:flex;direction:ltr}
.stars button{background:none;border:0;padding:0 2px;font-size:30px;line-height:1.2;color:var(--off);cursor:pointer;min-width:44px;min-height:44px}
.stars button.on{color:var(--star)}
.overall .stars{justify-content:space-between}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{margin:0;font-weight:400}
.seg input{position:absolute;opacity:0;width:0}
.seg span{display:block;border:1px solid var(--line);border-radius:999px;padding:6px 16px;cursor:pointer}
.seg input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.hp{position:absolute;left:-9999px}
.err{color:var(--err);min-height:1.5em;margin:0 0 8px;font-weight:600}
.send{width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:14px;font:800 18px Cairo,system-ui,sans-serif;cursor:pointer}
.send:disabled{opacity:.6;cursor:wait}
.done{text-align:center;padding:40px 20px}
.done h2{font-size:28px;margin:0 0 8px}
.done p{color:var(--muted);margin:0 0 20px}
.done button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 20px;font:inherit;cursor:pointer}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img class="logo" id="logo" src="logo.png" alt=""><button class="lang" id="lang" type="button"></button></div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>

  <form id="form" novalidate>
    <div class="field">
      <label for="branch" id="l_branch"></label>
      <select id="branch" required></select>
    </div>

    <div class="field">
      <span class="lbl" id="l_visit"></span>
      <div class="seg" id="visit"></div>
    </div>

    <div class="overall">
      <span class="lbl" id="l_overall"></span>
      <div class="stars rating" data-key="overall" role="radiogroup" aria-labelledby="l_overall"></div>
    </div>

    <div class="field" id="cats"></div>

    <div class="field">
      <label for="comment" id="l_comment"></label>
      <textarea id="comment" maxlength="1000"></textarea>
    </div>

    <div class="field">
      <label for="name" id="l_name"></label>
      <input id="name" autocomplete="name" maxlength="80">
    </div>
    <div class="field">
      <label for="contact" id="l_contact"></label>
      <input id="contact" autocomplete="tel" inputmode="tel" maxlength="80">
    </div>

    <input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="err" id="err" role="alert" aria-live="polite"></p>
    <button class="send" id="send" type="submit"></button>
  </form>

  <div class="done" id="done" hidden>
    <h2 id="d_title"></h2>
    <p id="d_text"></p>
    <button id="again" type="button"></button>
  </div>
</div>

<script>
/* ===== الإعدادات — عدّل هنا فقط ===== */
const CONFIG = {
  brand: "Caribou Coffee",                 // اسم البراند
  endpoint: "",                            // رابط Google Apps Script Web App (انظر README)
  branches: ["Branch 1", "Branch 2", "Branch 3"], // احتياطي فقط — الفروع بتتحمل من تاب Branches في الشيت
  resetSeconds: 10                         // رجوع تلقائي للفورم بعد الإرسال (مفيد للتابلت في الفرع)
};
/* ==================================== */

const T = {
  ar: {
    lang: "English", title: "رأيك يهمنا", sub: "قيّم زيارتك في أقل من دقيقة.",
    branch: "الفرع", pick: "اختر الفرع", visit: "نوع الزيارة",
    visits: ["داخل الفرع", "تيك أواي", "دليفري"],
    overall: "تقييمك العام", cats: { food: "الطعام والمشروبات", service: "الخدمة", clean: "النظافة", speed: "سرعة التحضير" },
    comment: "ملاحظاتك", name: "الاسم", contact: "رقم الموبايل", optional: "اختياري",
    send: "إرسال التقييم", sending: "جارٍ الإرسال…",
    eBranch: "اختر الفرع.", eRate: "اختر تقييمك العام من 1 إلى 5 نجوم.", eNet: "تعذّر الإرسال. تأكد من الاتصال وحاول مرة أخرى.",
    dTitle: "شكرًا لك", dText: "وصلنا تقييمك وهنراجعه.", again: "تقييم جديد", star: "نجمة"
  },
  en: {
    lang: "العربية", title: "Tell us how we did", sub: "Rate your visit in under a minute.",
    branch: "Branch", pick: "Select a branch", visit: "Visit type",
    visits: ["Dine-in", "Takeaway", "Delivery"],
    overall: "Overall rating", cats: { food: "Food & drinks", service: "Service", clean: "Cleanliness", speed: "Speed" },
    comment: "Comments", name: "Name", contact: "Mobile number", optional: "optional",
    send: "Send feedback", sending: "Sending…",
    eBranch: "Select a branch.", eRate: "Choose an overall rating from 1 to 5 stars.", eNet: "Couldn’t send. Check your connection and try again.",
    dTitle: "Thank you", dText: "We received your feedback and will review it.", again: "New feedback", star: "star"
  }
};

const $ = id => document.getElementById(id);
let lang = localStorage.getItem("gf_lang") || "ar";
let BRANCHES = CONFIG.branches;
const ratings = { overall: 0, food: 0, service: 0, clean: 0, speed: 0 };

function paintStars(group) {
  const key = group.dataset.key, v = ratings[key];
  group.querySelectorAll("button").forEach((b, i) => {
    b.classList.toggle("on", i < v);
    b.setAttribute("aria-checked", i + 1 === v);
  });
}

function buildStars(group) {
  group.innerHTML = "";
  for (let i = 1; i <= 5; i++) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = "★";
    b.setAttribute("role", "radio");
    b.setAttribute("aria-label", i + " " + T[lang].star);
    b.addEventListener("click", () => { ratings[group.dataset.key] = i; paintStars(group); $("err").textContent = ""; });
    group.appendChild(b);
  }
  paintStars(group);
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  $("logo").alt = CONFIG.brand;
  $("lang").textContent = t.lang;
  $("title").textContent = t.title; $("sub").textContent = t.sub;
  $("l_branch").textContent = t.branch; $("l_visit").textContent = t.visit;
  $("l_overall").textContent = t.overall;
  $("l_comment").innerHTML = t.comment + ' <span class="opt">(' + t.optional + ")</span>";
  $("l_name").innerHTML = t.name + ' <span class="opt">(' + t.optional + ")</span>";
  $("l_contact").innerHTML = t.contact + ' <span class="opt">(' + t.optional + ")</span>";
  $("send").textContent = t.send;
  $("d_title").textContent = t.dTitle; $("d_text").textContent = t.dText; $("again").textContent = t.again;

  const sel = $("branch"), cur = sel.value;
  sel.innerHTML = '<option value="">' + t.pick + "</option>" + BRANCHES.map(b => `<option>${b}</option>`).join("");
  sel.value = cur;

  const checked = (document.querySelector("input[name=visit]:checked") || {}).value || "0";
  $("visit").innerHTML = t.visits.map((v, i) =>
    `<label><input type="radio" name="visit" value="${i}"${String(i) === checked ? " checked" : ""}><span>${v}</span></label>`).join("");

  $("cats").innerHTML = Object.keys(t.cats).map(k =>
    `<div class="row"><span class="lbl" id="l_${k}">${t.cats[k]}</span><div class="stars rating" data-key="${k}" role="radiogroup" aria-labelledby="l_${k}"></div></div>`).join("");
  document.querySelectorAll(".rating").forEach(buildStars);
}

$("lang").addEventListener("click", () => { lang = lang === "ar" ? "en" : "ar"; localStorage.setItem("gf_lang", lang); render(); });

let timer;
function reset() {
  clearTimeout(timer);
  Object.keys(ratings).forEach(k => ratings[k] = 0);
  $("form").reset(); $("err").textContent = "";
  $("done").hidden = true; $("form").hidden = false;
  render(); window.scrollTo(0, 0);
}
$("again").addEventListener("click", reset);

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const t = T[lang], err = $("err");
  if ($("website").value) return;                       // honeypot (بوتات)
  if (!$("branch").value) { err.textContent = t.eBranch; $("branch").focus(); return; }
  if (!ratings.overall) { err.textContent = t.eRate; return; }

  const payload = {
    branch: $("branch").value,
    visit: T.en.visits[+document.querySelector("input[name=visit]:checked").value],
    overall: ratings.overall, food: ratings.food, service: ratings.service,
    clean: ratings.clean, speed: ratings.speed,
    comment: $("comment").value.trim(), name: $("name").value.trim(), contact: $("contact").value.trim(),
    lang
  };

  const btn = $("send"); btn.disabled = true; btn.textContent = t.sending; err.textContent = "";
  try {
    if (CONFIG.endpoint) {
      await fetch(CONFIG.endpoint, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
    } else {
      console.info("Demo mode (no endpoint set):", payload);
    }
    $("form").hidden = true; $("done").hidden = false;
    timer = setTimeout(reset, CONFIG.resetSeconds * 1000);
  } catch (x) {
    err.textContent = t.eNet;
  } finally {
    btn.disabled = false; btn.textContent = t.send;
  }
});

async function loadBranches() {
  if (!CONFIG.endpoint) return;
  try {
    const d = await (await fetch(CONFIG.endpoint + "?action=branches")).json();
    if (d.ok && d.branches.length) { BRANCHES = d.branches; render(); }
  } catch (e) { /* نستخدم القائمة الافتراضية */ }
}

render();
loadBranches();
</script>
</body>
</html>
